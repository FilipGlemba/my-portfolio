name: E-shop lint

on:
  push:
    paths:
      - "eshop/**"
  pull_request:
    paths:
      - "eshop/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eshop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: eshop/package-lock.json
      - run: npm ci
      - run: npm run lint
