<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Táto stránka beží na dvoch rôznych base cestách naraz — GitHub Pages
      // ju servíruje pod /my-portfolio/, Vercel v koreni domény. 404.html sa
      // ale zobrazuje pre AKÚKOĽVEK neexistujúcu cestu (aj hlbokú), takže
      // relatívne odkazy/CSS by sa bez tohto <base> vyriešili nesprávne.
      document.write(
        '<base href="' +
          (location.hostname.endsWith("github.io")
            ? location.origin + "/my-portfolio/"
            : location.origin + "/") +
          '">'
      );
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Stránka nenájdená | Filip Glemba</title>

    <style>

        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        gap: 1rem;
      }
      .nf-code {
        font-family: var(--ff-mono);
        font-size: 13px;
        letter-spacing: 0.1em;
        color: var(--ink3);
      }
      .nf-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.5rem 1.25rem;
        margin-top: 0.5rem;
      }
      .nf-links a {
        color: var(--ink2);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .nf-links a:hover {
        color: var(--ink);
      }
    </style>
  </head>
  <body>
