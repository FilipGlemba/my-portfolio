# Optional: only needed if you want a persistent local database instead of
# the automatic in-memory MongoDB used by default in development (see
# src/lib/dev-mongo.ts). Start with `docker compose up -d`, then set
# MONGODB_URI in .env.local to the value below and run `npm run seed`.
services:
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: fitgear
      MONGO_INITDB_ROOT_PASSWORD: fitgear123
      MONGO_INITDB_DATABASE: fitgear
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
